name: orman_muhasebe
description: Orman işi masraf ve borç-alacak takip uygulaması.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # Fotoğraf çekme / seçme
  image_picker: ^1.1.2

  # Bağlantı durumu (offline fiş yükleme kuyruğu için)
  connectivity_plus: ^6.1.0

  # Yerel bekleyen-yükleme kuyruğu (offline fiş desteği)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Tarih formatlama (tr_TR)
  intl: ^0.19.0

  # Benzersiz kimlik üretimi (yerel kayıtlar için)
  uuid: ^4.5.1

  # Web mockup'taki Oswald / Fraunces fontları (indirme gerektirmez)
  google_fonts: ^6.2.1

  # Firebase Storage'dan gelen fiş fotoğraflarını önbellekleyerek gösterme
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
