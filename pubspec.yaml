name: orman_muhasebe
description: Orman işi masraf/borç takip uygulaması.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_auth: ^5.3.1

  # Yerel depolama (fotoğraf yükleme kuyruğu)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Ağ durumu / bağlantı değişikliklerini dinleme
  connectivity_plus: ^6.0.5

  # Kamera / galeriden fotoğraf seçme
  image_picker: ^1.1.2

  # Tarih/para biçimlendirme
  intl: ^0.19.0

  # Yazı tipleri (Oswald, Fraunces)
  google_fonts: ^6.2.1

  # Firebase Storage'dan gelen fiş fotoğraflarını önbellekleyerek gösterme
  cached_network_image: ^3.4.1

  # İş dökümünü PDF olarak oluşturup paylaşma (WhatsApp/e-posta)
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/images/logo.png
