plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}
 
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}
 
def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0.0"
 
android {
    namespace = "com.ormanmuhasebe.app"
    compileSdk = 35
    ndkVersion = "26.1.10909125"
 
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
 
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
 
    defaultConfig {
        applicationId = "com.ormanmuhasebe.app"
        minSdk = 23
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled = true
    }
 
    buildTypes {
        release {
            // İlk testler için debug imzasıyla derleniyor — Play Store'a
            // basmadan önce kendi imzalama anahtarınla değiştirmen gerekir.
            signingConfig = signingConfigs.debug
        }
    }
}
 
flutter {
    source = "../.."
}
 
dependencies {
    implementation platform("com.google.firebase:firebase-bom:33.1.2")
    implementation "androidx.multidex:multidex:2.0.1"
}
 
// google-services.json dosyası varsa (Firebase bağlandıysa) eklentiyi
// otomatik uygula. Dosya henüz yoksa (ilk build denemesi) atla — böylece
// Firebase bağlanmadan da APK derlenebiliyor.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}
 
